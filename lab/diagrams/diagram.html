<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagrams</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <a class="home" href="../../index.html">&larr; home</a>
  <h1>Diagrams</h1>
</div>
<main>
  <a class="back" href="index.html">&larr; all diagrams</a>
  <div id="view"></div>
</main>
<script type="module">
  import { manifest } from "./manifest.js";

  const view = document.getElementById("view");
  let cleanup = () => {};

  function render() {
    cleanup();
    cleanup = () => {};
    const id = location.hash.replace("#", "");
    const d = manifest.find((m) => m.id === id) || manifest[0];
    if (!d) {
      view.innerHTML = "<p>No diagrams found.</p>";
      return;
    }
    document.title = `${d.title} — Diagrams`;
    view.innerHTML = `
      <h2>${d.title}</h2>
      <div class="source">${d.source}</div>
      <div class="dg-wrap">
        <div class="dg-mount"></div>
        <div class="dg-explain">
          <p>${d.blurb}</p>
          <span class="cite">${d.cite}</span>
        </div>
      </div>
    `;
    const mountEl = view.querySelector(".dg-mount");
    const maybeCleanup = d.mount(mountEl);
    if (typeof maybeCleanup === "function") cleanup = maybeCleanup;
  }

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = `#${manifest[0].id}`;
  render();
</script>
</body>
</html>
