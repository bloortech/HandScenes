<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Machine — poke to pop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap">
<style>
  :root { --neon: #7ad7ff; --bg: #05070f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: 'VT323', monospace; color: #dff4ff; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }

  /* start gate (camera permission must come from a click) */
  #gate {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(circle at 50% 40%, #0b1430, #04050b 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center; padding: 24px;
  }
  #gate h1 { font-family: 'Press Start 2P', monospace; font-size: 24px; color: var(--neon);
    text-shadow: 0 0 14px rgba(122,215,255,0.6); margin: 0; line-height: 1.6; }
  #gate p { font-size: 20px; opacity: 0.8; max-width: 420px; margin: 0; }
  #start { font-family: 'Press Start 2P', monospace; font-size: 15px; cursor: pointer;
    color: #04120e; background: var(--neon); border: 0; border-radius: 8px; padding: 15px 24px;
    box-shadow: 0 0 22px rgba(122,215,255,0.6); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 34px rgba(122,215,255,0.95); } }
  #note { font-size: 17px; opacity: 0.55; max-width: 420px; }
  #note.err { color: #ff9a9a; opacity: 0.9; }
  #gate-loader { display: none; width: 250px; max-width: 80vw; height: 13px; overflow: hidden;
    border: 2px solid rgba(122,215,255,0.4); border-radius: 4px; background: rgba(122,215,255,0.08); }
  #gate-loader::before { content: ''; display: block; height: 100%; width: 38%;
    background: var(--neon); box-shadow: 0 0 12px var(--neon); animation: scan 1.1s ease-in-out infinite; }
  @keyframes scan { 0% { transform: translateX(-110%); } 100% { transform: translateX(285%); } }
  #gate.loading #start { display: none; }
  #gate.loading #gate-loader { display: block; }
</style>
</head>
<body>
  <a href="/" title="back to HandScenes" style="position:fixed;top:10px;left:10px;z-index:9999;font-family:'VT323',monospace;font-size:16px;color:#04120e;background:#38f9d7;border-radius:6px;padding:6px 11px;text-decoration:none;box-shadow:0 0 12px rgba(56,249,215,0.5);opacity:0.9">← SCENES</a>
  <div id="gate">
    <h1>BUBBLE<br>MACHINE</h1>
    <p>Bubbles float up — poke them with your finger to pop. Runs in your browser; nothing is uploaded.</p>
    <button id="start">▶ PRESS START</button>
    <div id="gate-loader" aria-hidden="true"></div>
    <small id="note">you'll be asked for camera access — click allow</small>
  </div>

  <video id="cam" autoplay muted playsinline style="display:none"></video>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script type="module" src="sketch.js"></script>
</body>
</html>
