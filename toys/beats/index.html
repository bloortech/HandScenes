<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Beats — poke a drum grid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap">
<style>
  :root { --neon: #ff5fa2; --bg: #07060f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: 'VT323', monospace; color: #ffe9f2; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }

  #gate {
    position: fixed; inset: 0; z-index: 20;
    background: radial-gradient(circle at 50% 40%, #1a0f24, #05040b 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; text-align: center; padding: 24px;
  }
  #gate h1 { font-family: 'Press Start 2P', monospace; font-size: 23px; color: var(--neon);
    text-shadow: 0 0 14px rgba(255,95,162,0.6); margin: 0; line-height: 1.6; }
  #gate p { font-size: 20px; opacity: 0.8; max-width: 440px; margin: 0; }
  #start { font-family: 'Press Start 2P', monospace; font-size: 15px; cursor: pointer;
    color: #1a0010; background: var(--neon); border: 0; border-radius: 8px; padding: 15px 24px;
    box-shadow: 0 0 22px rgba(255,95,162,0.6); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 34px rgba(255,95,162,0.95); } }
  #note { font-size: 17px; opacity: 0.55; max-width: 440px; }
  #note.err { color: #ff9a9a; opacity: 0.95; }
  #gate-loader { display: none; width: 250px; max-width: 80vw; height: 12px; overflow: hidden;
    border: 2px solid rgba(255,95,162,0.45); border-radius: 4px; }
  #gate-loader::before { content: ''; display: block; height: 100%; width: 38%;
    background: var(--neon); box-shadow: 0 0 12px var(--neon); animation: scan 1.1s ease-in-out infinite; }
  @keyframes scan { 0% { transform: translateX(-110%); } 100% { transform: translateX(285%); } }
  #gate.loading #start { display: none; }
  #gate.loading #gate-loader { display: block; }

  #panel { position: fixed; top: 12px; right: 12px; z-index: 8; display: none;
    flex-direction: column; gap: 9px; width: 190px; padding: 10px 12px;
    background: rgba(15,8,22,0.82); border: 2px solid rgba(255,95,162,0.45);
    border-radius: 8px; backdrop-filter: blur(3px); }
  body.go #panel { display: flex; }
  #panel h3 { margin: 0 0 2px; font-size: 17px; letter-spacing: 1px; color: var(--neon); }
  .ctrl .row { display: flex; justify-content: space-between; font-size: 16px; }
  .ctrl .row .val { opacity: 0.65; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 12px;
    background: transparent; margin: 2px 0 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: rgba(255,95,162,0.35); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 14px;
    margin-top: -6px; background: var(--neon); cursor: pointer; }
  .opts { display: flex; gap: 5px; }
  .opts button { font-family: 'VT323', monospace; font-size: 15px; cursor: pointer; flex: 1;
    background: transparent; color: #ffe9f2; border: 1px solid rgba(255,95,162,0.45);
    border-radius: 4px; padding: 2px 4px; }
  .opts button.active { background: var(--neon); color: #1a0010; }
  .row-btns { display: flex; gap: 6px; }
  .row-btns button, .tog { font-family: 'VT323', monospace; font-size: 15px; cursor: pointer;
    flex: 1; background: transparent; color: #ffe9f2; border: 1px solid rgba(255,95,162,0.45);
    border-radius: 4px; padding: 3px 6px; }
  .tog.on { background: var(--neon); color: #1a0010; }
</style>
</head>
<body>
  <a href="/" title="back to HandScenes" style="position:fixed;top:10px;left:10px;z-index:9999;font-family:'VT323',monospace;font-size:16px;color:#04120e;background:#38f9d7;border-radius:6px;padding:6px 11px;text-decoration:none;box-shadow:0 0 12px rgba(56,249,215,0.5);opacity:0.9">← SCENES</a>
  <div id="gate">
    <h1>HAND<br>BEATS</h1>
    <p>Poke the glowing grid with your finger to build a drum loop. Runs in your browser; nothing is uploaded.</p>
    <button id="start">▶ PRESS START</button>
    <div id="gate-loader" aria-hidden="true"></div>
    <small id="note">you'll be asked for camera + audio — click allow</small>
  </div>

  <video id="cam" autoplay muted playsinline style="display:none"></video>

  <div id="panel">
    <h3>HAND BEATS</h3>
    <div class="ctrl"><div class="row"><span>KIT</span></div>
      <div class="opts" id="kit">
        <button data-k="808" class="active">808</button>
        <button data-k="909">909</button>
        <button data-k="acoustic">acoustic</button>
      </div></div>
    <div class="ctrl"><div class="row"><span>TEMPO</span><span class="val" id="v-bpm"></span></div>
      <input type="range" id="bpm" min="60" max="160" step="1"></div>
    <div class="ctrl"><div class="row"><span>VOLUME</span><span class="val" id="v-vol"></span></div>
      <input type="range" id="vol" min="-30" max="3" step="1"></div>
    <button class="tog on" id="metro">METRONOME: ON</button>
    <div class="row-btns"><button id="clear">CLEAR</button></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
  <script type="module" src="sketch.js"></script>
</body>
</html>
